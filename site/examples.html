<section class="section">
  <div class="container">

    <!-- gallery list view -->
    <div id="gallery-view">
      <div class="section-head">
        <div class="kicker">GALLERY</div>
        <h2>示例漫画</h2>
        <p>每一部示例都附完整的概念递进链——看漫画的同时能看到"每个概念为什么在那一页登场"。</p>
      </div>
      <div class="gallery-grid" id="gallery-grid" hidden></div>
      <div class="empty-state" id="gallery-empty" hidden>
        <div class="art" aria-hidden="true">
          <svg width="96" height="72" viewBox="0 0 96 72" fill="none">
            <rect x="6" y="10" width="34" height="46" rx="3" fill="#eceef2" stroke="#c8cad4" stroke-width="1.5"/>
            <rect x="12" y="16" width="22" height="12" rx="1.5" fill="#d9dbe2"/>
            <rect x="12" y="32" width="22" height="6" rx="1.5" fill="#d9dbe2"/>
            <rect x="12" y="42" width="14" height="6" rx="1.5" fill="#d9dbe2"/>
            <rect x="56" y="10" width="34" height="46" rx="3" fill="#fff0e9" stroke="#ffb99a" stroke-width="1.5" stroke-dasharray="5 4"/>
            <path d="M69 30 h8 M69 36 h8 M69 42 h5" stroke="#ff6b35" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M45 33 h6 m-3 -3 v6" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </div>
        <h3>第一部示例正在路上</h3>
        <p>示例漫画将由本 skill 用原创角色（小满与奇普）实际生成——生成额度恢复后，第一批示例会出现在这里。每一部都会展示：逐页漫画、概念递进链、以及它为什么这样分镜。</p>
        <span class="hint">本站示例拒绝使用第三方角色形象</span>
      </div>
    </div>

    <!-- reader view (hidden until a comic is opened) -->
    <div class="reader" id="reader">
      <div class="reader-top">
        <button class="back" id="reader-back">← 返回画廊</button>
        <strong id="reader-title"></strong>
      </div>
      <div class="reader-body">
        <div>
          <div class="reader-page-wrap">
            <img id="reader-img" src="" alt="漫画页面">
            <div class="reader-nav">
              <button id="reader-prev">← 上一页</button>
              <span class="pos" id="reader-pos"></span>
              <button id="reader-next">下一页 →</button>
            </div>
          </div>
          <p id="reader-caption" style="text-align:center; margin-top:10px; color: var(--ink-soft); font-size: 0.9rem;"></p>
        </div>
        <aside class="reader-side">
          <div class="panel">
            <h4>学习目标</h4>
            <p class="goal" id="reader-goal"></p>
          </div>
          <div class="panel">
            <h4>概念递进链</h4>
            <ol class="chain-mini" id="reader-chain"></ol>
          </div>
        </aside>
      </div>
    </div>

  </div>
